<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact | Rob J Kennedy</title><style> :root{--ink:#242c2b;--paper:#f4f1e9;--line:#cfc9bc;--red:#a3513f}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Georgia,serif}a{color:inherit}header{padding:28px 6%;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:20px} .brand{text-decoration:none;font-size:21px;letter-spacing:.03em}nav{display:flex;gap:24px;flex-wrap:wrap;font:13px Arial,sans-serif;letter-spacing:.05em}nav a{text-decoration:none}nav a:hover,.links a:hover{color:var(--red)}main{max-width:1220px;margin:auto;padding:0 6%}.hero{display:grid;grid-template-columns:1.2fr .8fr;min-height:440px;align-items:center;gap:50px;border-bottom:1px solid var(--line);padding:65px 0}.eyebrow,.label{font:11px Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--red)}h1{font-size:clamp(52px,7vw,94px);font-weight:normal;line-height:.98;margin:22px 0}h1 span{font-style:italic;color:#62736a}.intro{font-size:20px;line-height:1.6;max-width:550px}.portrait{width:100%;height:360px;object-fit:cover;object-position:center;border-radius:2px}.art{height:310px;background:#d7ded5;position:relative;overflow:hidden}.art:before{content:'';position:absolute;width:230px;height:230px;border:1px solid #859a8a;border-radius:50%;top:38px;left:calc(50% - 115px)}.art:after{content:'WORDS  /  MUSIC  /  IDEAS';position:absolute;bottom:25px;left:25px;font:10px Arial;letter-spacing:.18em;color:#53685c}.section{padding:65px 0;border-bottom:1px solid var(--line)}.sectionhead{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:28px}h2{font-size:38px;font-weight:normal;margin:10px 0}.small{font:12px Arial;color:#6e746d;letter-spacing:.04em}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:#e7e6dc;min-height:230px;padding:28px;display:flex;flex-direction:column;justify-content:space-between;text-decoration:none;transition:background .2s}.card:nth-child(2){background:#e5d9cf}.card:nth-child(3){background:#dce2da}.card:hover{background:#d3ded5}.card h3{font-size:30px;font-weight:normal;margin:16px 0 6px}.card p{line-height:1.55;margin:0;max-width:260px}.arrow{font-size:22px}.two{display:grid;grid-template-columns:1fr 1fr;gap:60px}.two p{font-size:18px;line-height:1.7}.links a{display:block;padding:16px 0;border-bottom:1px solid var(--line);text-decoration:none;font-size:19px}.note{color:#70746c;font-size:15px!important}footer{padding:40px 6%;max-width:1220px;margin:auto;display:flex;justify-content:space-between;font:12px Arial;color:#6e746d}@media(max-width:700px){header{align-items:flex-start;flex-direction:column}nav{gap:14px}.hero{grid-template-columns:1fr;gap:20px;padding:50px 0}.portrait{width:100%;height:360px;object-fit:cover;object-position:center;border-radius:2px}.art{height:180px}.art:before{width:130px;height:130px;left:calc(50% - 65px);top:20px}.grid,.two{grid-template-columns:1fr}.card{min-height:180px}.section{padding:45px 0}footer{display:block}}.contact-form{max-width:520px;display:grid;gap:10px;margin-top:26px}.contact-form label{font-size:17px;margin-top:8px}.contact-form input,.contact-form textarea{width:100%;padding:12px;border:1px solid #8b9188;border-radius:3px;background:#fffdf8;color:var(--ink);font:17px Arial,sans-serif}.contact-form textarea{resize:vertical}.contact-form button{justify-self:start;border:0;border-radius:3px;background:var(--ink);color:var(--paper);padding:14px 24px;font:16px Arial,sans-serif;cursor:pointer;margin-top:8px}.contact-form button:disabled{opacity:.65;cursor:wait}.contact-form :focus-visible{outline:3px solid var(--red);outline-offset:3px}.form-trap{position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden}#form-status:empty{display:none}#form-status{line-height:1.5;margin:4px 0}.contact-form .note{line-height:1.5;margin:4px 0}</style></head><body><header><a class="brand" href="index.html">Rob J Kennedy</a><nav aria-label="Main navigation"><a href="articles.html">Writing</a><a href="books.html">Books</a><a href="music.html">Music</a><a href="about.html">About</a><a href="contact.html">Contact</a><a href="search.html">Search</a></nav></header><main><section class="section" style="min-height:65vh"><div class="label">Get in touch</div><h1 style="font-size:clamp(44px,6vw,72px)">Contact</h1><p class="intro">For enquiries about Rob’s writing, books or music, please use the form below.</p><form id="contact-form" class="contact-form">
<label for="sender-name">Name</label><input id="sender-name" name="name" autocomplete="name" maxlength="150" required>
<label for="sender-email">Email</label><input id="sender-email" name="email" type="email" autocomplete="email" maxlength="254" required>
<label for="message">Message</label><textarea id="message" name="message" rows="5" maxlength="10000" required></textarea>
<div class="form-trap" aria-hidden="true"><label for="website">Leave this empty</label><input id="website" name="_honey" tabindex="-1" autocomplete="off"></div>
<input type="hidden" name="_subject" value="Website enquiry for Rob J Kennedy">
<button type="submit">Send message</button><p id="form-status" role="status" aria-live="polite"></p>
<p class="note">Messages are delivered through FormSubmit. Please avoid including sensitive information.</p></form><noscript>Please enable JavaScript to send a message.</noscript></section></main><footer>Rob J Kennedy · Writing &amp; Music</footer><script>
const form=document.getElementById('contact-form'),status=document.getElementById('form-status'),button=form.querySelector('button');
form.addEventListener('submit',async(event)=>{
event.preventDefault();
if(form.elements._honey.value)return;
button.disabled=true;status.textContent='Sending…';
try{
const payload=Object.fromEntries(new FormData(form));
payload._captcha='false';
const response=await fetch('https://formsubmit.co/ajax/'+atob('a2Vucm9iMjAzN0BnbWFpbC5jb20='),{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(payload)});
const result=await response.json();
if(!response.ok||!(result.success===true||result.success==='true')){
status.textContent=(typeof result.message==='string' ? result.message : 'The contact service could not accept your message.')+' Your message has been kept in the form.';
return;
}
status.textContent='Your message has been submitted. Thank you.';
form.reset();
}catch(error){status.textContent='Your message could not be sent. Please try again shortly. Your message has been kept in the form.';}
finally{button.disabled=false;}
});
</script></body></html>
